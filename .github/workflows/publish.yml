name: Publish to npm

on:
  push:
    branches: [master]
  pull_request:
    paths:
      - '.github/workflows/publish.yml'
      - '.changeset/config.json'
      - 'scripts/prepare-nightly*'
      - 'package.json'
      - 'bun.lock'
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Required for npm trusted publishing
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: Check dependency release age
        run: bun run security:release-age

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check release versions
        env:
          PRERELEASE_TAG: rc
          RELEASE_PRERELEASE: ${{ github.event.release.prerelease }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: bun scripts/check-release.ts

      - name: Build packages
        run: bun run build

      - name: Prepare prerelease publish
        if: ${{ github.event.release.prerelease }}
        run: rm .changeset/pre.json

      - name: Publish prerelease to npm
        if: ${{ github.event.release.prerelease }}
        run: bunx changeset publish --tag rc

      - name: Publish stable to npm
        if: ${{ github.event.release.prerelease == false }}
        run: bunx changeset publish

  nightly-validation:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - run: bun run security:release-age
      - run: bun install --frozen-lockfile
      - name: Test nightly preparation and release isolation
        run: bun test scripts/prepare-nightly.test.ts
      - name: Prepare and validate snapshot versions
        run: bun scripts/prepare-nightly.ts prepare
      - name: Build and typecheck the snapshot packages
        run: |
          bun run build
          bun run typecheck
      - name: Recheck the snapshot manifests
        run: bun scripts/prepare-nightly.ts check

  publish-nightly:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    # Serialize complete publishes, including reruns. Never cancel a partial package set.
    concurrency:
      group: npm-nightly
      cancel-in-progress: false
      queue: max
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - run: bun run security:release-age
      - run: bun install --frozen-lockfile
      - run: bun scripts/prepare-nightly.ts prepare
      - run: bun run build
      - run: bun scripts/prepare-nightly.ts check
      - name: Check that this commit is still master
        id: current
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          master_sha="$(git ls-remote --exit-code origin refs/heads/master | cut -f1)"
          if [ "$master_sha" = "$EXPECTED_SHA" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "Skipping superseded commit $EXPECTED_SHA; master is $master_sha" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Publish nightly packages
        if: steps.current.outputs.publish == 'true'
        run: bunx --no-install changeset publish --tag nightly --no-git-tag

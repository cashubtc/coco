name: Publish to npm

on:
  release:
    types: [published]

jobs:
  publish:
    if: startsWith(github.event.release.tag_name, 'v')
    runs-on: ubuntu-latest
    env:
      PRERELEASE_TAG: rc
      RELEASE_PRERELEASE: ${{ github.event.release.prerelease }}
      RELEASE_TAG: ${{ github.event.release.tag_name }}
    permissions:
      contents: read
      id-token: write # Required for npm trusted publishing
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: Check dependency release age
        run: bun run security:release-age

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check release versions
        run: bun scripts/check-release.ts

      - name: Build packages
        run: bun run build

      - name: Select core packages for publication
        run: bun scripts/prepare-publish.ts

      - name: Prepare prerelease publish
        if: ${{ github.event.release.prerelease }}
        run: rm .changeset/pre.json

      - name: Publish prerelease to npm
        if: ${{ github.event.release.prerelease }}
        run: bunx changeset publish --tag rc

      - name: Publish stable to npm
        if: ${{ github.event.release.prerelease == false }}
        run: bunx changeset publish

  publish-fountain:
    if: startsWith(github.event.release.tag_name, 'coco-fountain-v')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    env:
      RELEASE_PRERELEASE: ${{ github.event.release.prerelease }}
      RELEASE_TAG: ${{ github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - name: Check dependency release age
        run: bun run security:release-age
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Check fountain release
        run: bun scripts/check-release.ts
      - name: Build fountain
        run: bun run --filter='@cashu/coco-fountain' build
      - name: Select fountain for publication
        run: bun scripts/prepare-publish.ts
      - name: Publish fountain to npm
        run: bunx changeset publish

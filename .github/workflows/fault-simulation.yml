name: wallet-fault-simulation

# Real-mint wallet fault simulation (packages/core/test/fault-simulation). Relevant pull requests
# and master pushes run the fixed corpus with fixed scenario seeds; the nightly schedule runs the
# fixed corpus with bounded random seeds. Only the scanner-approved portable output is uploaded;
# private Wallet Seeds and stores never leave the runner.
on:
  pull_request:
    paths:
      - 'packages/core/**'
      - 'packages/sql-storage/**'
      - 'packages/sqlite-bun/**'
      - 'package.json'
      - 'bun.lock'
      - '.github/workflows/fault-simulation.yml'
  push:
    branches:
      - master
    paths:
      - 'packages/core/**'
      - 'packages/sql-storage/**'
      - 'packages/sqlite-bun/**'
      - 'package.json'
      - 'bun.lock'
      - '.github/workflows/fault-simulation.yml'
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      profile:
        description: 'pr (fixed corpus and seeds) or nightly (fixed corpus with random seeds)'
        type: choice
        options:
          - nightly
          - pr
        default: nightly
      random_seeds:
        description: 'Nightly only: random seeds of each kind'
        type: string
        default: '3'

concurrency:
  group: fault-simulation-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  fault-simulation:
    runs-on: ubuntu-24.04
    # The suite enforces its own measured budget (pr 20 min, nightly 20 + 9 per random seed);
    # this is the outer bound for setup, image pulls and the budget itself.
    timeout-minutes: 75
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      # Not the repository's 1.3.11: that Bun's fetch resends a POST whose connection dropped, so
      # dropped swap requests and responses never reach Coco. The suite requires >= 1.3.14.
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      # The pinned Fault Lab gateway declares Node >=24 <25; the suite enforces it with
      # --strict-runtime.
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24.22.2'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run wallet fault simulation suite
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_PROFILE: ${{ inputs.profile }}
          RANDOM_SEEDS: ${{ inputs.random_seeds }}
          OUT_DIR: ${{ runner.temp }}/fault-simulation
        run: |
          profile=pr
          if [ "$EVENT_NAME" = schedule ]; then profile=nightly; fi
          if [ "$EVENT_NAME" = workflow_dispatch ]; then profile="$DISPATCH_PROFILE"; fi
          args=(--profile "$profile" --strict-runtime --out "$OUT_DIR")
          if [ "$profile" = nightly ]; then args+=(--random-seeds "${RANDOM_SEEDS:-3}"); fi
          bun packages/core/test/fault-simulation/suite.ts "${args[@]}"

      # Uploaded for every outcome, including failures and budget overruns, so the original
      # failure evidence survives any later rerun. Each attempt uploads under its own name.
      - name: Upload portable evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fault-simulation-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/fault-simulation/portable
          if-no-files-found: error
          retention-days: 30

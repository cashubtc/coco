name: fountain-tests

on:
  push:
    branches: [master]
    paths:
      - 'packages/fountain/**'
      - 'package.json'
      - 'bun.lock'
      - 'bunfig.toml'
      - '.github/workflows/fountain-tests.yml'
  pull_request:
    paths:
      - 'packages/fountain/**'
      - 'package.json'
      - 'bun.lock'
      - 'bunfig.toml'
      - '.github/workflows/fountain-tests.yml'

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Install Chromium
        run: bun --cwd packages/fountain playwright install --with-deps chromium
      - name: Run fountain compatibility tests
        run: bun run --filter='@cashu/coco-fountain' test
      - name: Check fountain types
        run: bun run --filter='@cashu/coco-fountain' typecheck
      - name: Run browser acceptance
        run: bun run --filter='@cashu/coco-fountain' test:browser
      - name: Verify isolated package artifact
        run: bun run --filter='@cashu/coco-fountain' test:package

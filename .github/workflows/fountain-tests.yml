name: fountain-tests

on:
  push:
    branches: [master]
    paths:
      - 'standalone/fountain/**'
      - 'package.json'
      - 'bun.lock'
      - 'bunfig.toml'
      - '.github/workflows/fountain-tests.yml'
      - '.github/workflows/publish-fountain.yml'
      - 'scripts/check-release-age.ts'
  pull_request:
    paths:
      - 'standalone/fountain/**'
      - 'package.json'
      - 'bun.lock'
      - 'bunfig.toml'
      - '.github/workflows/fountain-tests.yml'
      - '.github/workflows/publish-fountain.yml'
      - 'scripts/check-release-age.ts'

jobs:
  test:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: standalone/fountain
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - name: Check dependency release age
        run: bun ../../scripts/check-release-age.ts
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Install Chromium
        run: bunx --no-install playwright install --with-deps chromium
      - name: Run fountain compatibility tests
        run: bun run test
      - name: Check fountain types
        run: bun run typecheck
      - name: Run browser acceptance
        run: bun run test:browser
      - name: Verify isolated package artifact
        run: bun run test:package

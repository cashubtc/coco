name: cocod-tests

on:
  push:
    branches:
      - master
    paths:
      - 'packages/cocod/**'
      - 'packages/core/**'
      - 'packages/sql-storage/**'
      - 'packages/sqlite-bun/**'
      - 'package.json'
      - 'bun.lock'
      - '.github/workflows/cocod_tests.yml'
  pull_request:
    paths:
      - 'packages/cocod/**'
      - 'packages/core/**'
      - 'packages/sql-storage/**'
      - 'packages/sqlite-bun/**'
      - 'package.json'
      - 'bun.lock'
      - '.github/workflows/cocod_tests.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build workspace packages
        run: bun run build

      - name: Run cocod tests
        run: bun run --filter='cocod' test

name: Release PR checks

on:
  push:
    branches:
      - master
    paths:
      - 'scripts/release-*'
      - 'scripts/check-release.ts'
      - '.github/workflows/release-pr*.yml'
      - '.github/workflows/publish.yml'
      - '.agents/skills/cut-stable-release/scripts/check-stable-cutoff.sh'
      - '.changeset/config.json'
      - 'package.json'
      - 'bun.lock'
  # Always report the required release-files job, including on unrelated PRs.
  pull_request:

permissions:
  contents: read

jobs:
  release-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - run: bun install --frozen-lockfile
      - run: bun run test:release

  release-files:
    if: github.event_name == 'pull_request' && github.head_ref == format('changeset-release/{0}', github.base_ref)
    runs-on: ubuntu-latest
    env:
      RELEASE_BRANCH: ${{ github.base_ref }}
    steps:
      - name: Checkout proposed release merge
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - name: Validate release against its base and RC cutoff
        env:
          RELEASE_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          RELEASE_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: bun scripts/release-pr.ts check-pr "$RELEASE_BASE_SHA" "$RELEASE_HEAD_SHA"
      - run: bun run security:release-age
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bun run typecheck
